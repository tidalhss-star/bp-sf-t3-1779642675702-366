<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="-72" cy="652" r="85" fill="#1a1a2e" opacity="0.12"/>
    <circle cx="579" cy="464" r="90" fill="#1a1a2e" opacity="0.16"/>
    <circle cx="642" cy="376" r="80" fill="#1a1a2e" opacity="0.15"/>
    <circle cx="617" cy="-96" r="73" fill="#1a1a2e" opacity="0.10"/>
    <circle cx="598" cy="31" r="97" fill="#1a1a2e" opacity="0.08"/>
    <circle cx="1152" cy="228" r="65" fill="#1a1a2e" opacity="0.06"/>
    <rect x="122" y="28" width="54" height="46" rx="8" fill="#0a0a0a" opacity="0.07" transform="rotate(30, 548, 314)"/>
    <rect x="232" y="435" width="71" height="74" rx="8" fill="#0a0a0a" opacity="0.08" transform="rotate(19, 963, 416)"/>
    <rect x="672" y="-8" width="54" height="40" rx="8" fill="#0a0a0a" opacity="0.14" transform="rotate(29, 51, 407)"/>
    <rect x="827" y="165" width="63" height="79" rx="8" fill="#0a0a0a" opacity="0.12" transform="rotate(22, 250, 180)"/>
    <rect x="197" y="242" width="62" height="41" rx="8" fill="#0a0a0a" opacity="0.14" transform="rotate(26, -16, 330)"/>
    <rect x="352" y="296" width="62" height="49" rx="8" fill="#0a0a0a" opacity="0.08" transform="rotate(21, 336, 338)"/>
    <rect x="1187" y="172" width="59" height="33" rx="8" fill="#0a0a0a" opacity="0.13" transform="rotate(12, 765, 89)"/>
    <rect x="-18" y="-92" width="43" height="94" rx="8" fill="#0a0a0a" opacity="0.13" transform="rotate(0, 135, 98)"/>
    <polygon points="1255,641 1321,773 1189,773" fill="#1a1a2e" opacity="0.10"/>
    <polygon points="1201,387 1242,469 1160,469" fill="#1a1a2e" opacity="0.11"/>
    <polygon points="761,-88 837,64 685,64" fill="#1a1a2e" opacity="0.06"/>
    <polygon points="919,235 994,385 844,385" fill="#1a1a2e" opacity="0.09"/>

  <!-- Wave at bottom -->
  <path d="M0,578 C360,604 840,552 1200,578 L1200,630 L0,630Z" fill="#1a1a2e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    강남 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 성우이벤트
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#7c3aed" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 강남 셔츠룸 — 성우이벤트
  </text>
</svg>